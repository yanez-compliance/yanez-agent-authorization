components:
  schemas:
    AuthorizationCreateIn:
      additionalProperties: false
      properties:
        decision_window_seconds:
          default: 900
          description: How long the user has to decide before the request expires.
          maximum: 3600
          minimum: 60
          type: integer
        intent_expires_at:
          description: 'Optional consent bound: the point past which a relying party
            must refuse to ACT on the approval. The agent declares it from the user''s
            instruction; the app does not ask the approver to confirm it separately,
            so it is not evidence of a deadline the user set. It never limits verification,
            and it must be in the future at creation time.

            '
          format: date-time
          type:
          - string
          - 'null'
        terms:
          allOf:
          - $ref: '#/components/schemas/Terms'
          description: 'The versioned display profile the user is asked to approve.
            Enforced at creation: a request that does not match it is refused with
            a field-specific 400, and the whole object is capped at 4096 bytes of
            compact JSON (413 above that).

            '
      required:
      - terms
      type: object
    AuthorizationCreateOut:
      properties:
        decide_by:
          description: When the decision window closes.
          format: date-time
          type: string
        request_id:
          description: Authorization request id (azr_...); also the receipt's jti.
          type: string
        status:
          description: Always pending on a fresh create.
          enum:
          - pending
          - approved
          - rejected
          - expired
          type: string
      required:
      - request_id
      - status
      - decide_by
      type: object
    AuthorizationOut:
      properties:
        artifact:
          description: 'Compact EdDSA JWS receipt, present only when status is approved.
            Its claims: iss (exact Yanez issuer), sub (approving YID), jti (request
            id, the replay identifier), iat (NumericDate, equals decision time), yanez_agent_key_id
            (non-secret id of the requesting agent key), yanez_decision (always "approved"),
            yanez_decided_at (NumericDate), yanez_match_overlap (non-negative integer
            of issuer evidence — verifiers must not assume its maximum or a threshold),
            yanez_terms (verbatim approved terms), and optional yanez_consent_not_after
            (NumericDate bound on acting).

            It also carries the approver''s own proof: yanez_assurance_tier (low/medium/high),
            yanez_user_public_key and yanez_user_signature (0x-prefixed hex, 48-byte
            compressed G1 and 96-byte compressed G2), yanez_signed_message (unpadded
            base64url of the exact bytes the user signed), and yanez_user_sig_alg
            ("BLS12-381-G2-basic"). Verify that signature over those exact decoded
            bytes, then check every field inside the message against the receipt —
            skipping the cross-checks makes the signature decorative.

            There is no exp: the receipt is durable evidence of a past approval, not
            an expiring capability token.

            '
          type:
          - string
          - 'null'
        consent_not_after:
          description: 'The agent-declared consent bound on acting, echoed back. The
            receipt itself never stops verifying.

            '
          format: date-time
          type:
          - string
          - 'null'
        decided_at:
          format: date-time
          type:
          - string
          - 'null'
        request_id:
          type: string
        status:
          enum:
          - pending
          - approved
          - rejected
          - expired
          type: string
      required:
      - request_id
      - status
      type: object
    AuthzJwk:
      description: Flat Ed25519 JWK (no nesting).
      properties:
        alg:
          enum:
          - EdDSA
          type: string
        crv:
          enum:
          - Ed25519
          type: string
        kid:
          example: authz_2026_08
          type: string
        kty:
          enum:
          - OKP
          type: string
        x:
          description: Base64url raw public key bytes.
          type: string
      required:
      - kty
      - crv
      - x
      - kid
      - alg
      type: object
    Error:
      properties:
        detail:
          type: string
      type: object
    IntrospectIn:
      additionalProperties: false
      properties:
        artifact:
          description: The compact JWS receipt. The receipt is the bearer proof.
          type: string
        consume:
          default: false
          description: 'When true, permanently reserves the receipt''s jti if it is
            valid, unconsumed, and within its consent bound — single-use enforcement.
            The action executor owns this call, immediately before executing.

            '
          type: boolean
        consumer_token:
          description: 'Required when consume is true, and never generated by the
            server: a server-minted token would be lost with the response it travelled
            in, which is the exact failure it exists to survive. Persist it before
            the first consume call.

            It identifies the reservation''s owner, so a retry after a lost response
            can tell its own earlier attempt (reservation_held, safe to resume) from
            another holder''s (already_consumed, stop). A missing, blank, or oversized
            token is a 400 and changes no state.

            '
          maxLength: 128
          type:
          - string
          - 'null'
      required:
      - artifact
      type: object
    IntrospectOut:
      properties:
        assurance_tier:
          description: 'The tier the approving scan achieved. Check it against your
            own floor for the value at risk; the issuer imposes no floor.

            '
          enum:
          - low
          - medium
          - high
          type:
          - string
          - 'null'
        consent_not_after:
          description: The agent-declared consent bound as a NumericDate, when one
            was set.
          type:
          - integer
          - 'null'
        consumed_now:
          description: 'true when this call reserved the jti; false when consumption
            was refused; null when consume was false.

            '
          type:
          - boolean
          - 'null'
        decided_at:
          description: NumericDate of approval. Present on every valid response.
          type:
          - integer
          - 'null'
        jti:
          description: Request id / replay identifier. Present on every valid response.
          type:
          - string
          - 'null'
        reason:
          description: 'bad_signature comes with valid=false; a receipt minted before
            user-signed approvals lands here, because it lacks the five proof claims
            and does not meet this contract.

            consent_expired and already_consumed come with valid=true and consumed_now=false
            — the receipt is genuine but must not be acted on.

            reservation_held also comes with consumed_now=false, but it is a successful
            recovery rather than a refusal: this caller''s own token already holds
            the reservation, so it may resume, re-evaluating its execution policy
            and reusing the original downstream idempotency key.

            Never gate on `valid` alone. It answers "is this receipt genuine", which
            stays true forever and says nothing about whether you may act.

            '
          enum:
          - bad_signature
          - consent_expired
          - already_consumed
          - reservation_held
          - null
          type:
          - string
          - 'null'
        signed_message:
          description: 'Unpadded base64url of the exact bytes the user signed. Verify
            over these decoded bytes; never re-serialize the parsed object.

            '
          type:
          - string
          - 'null'
        sub:
          description: Approving YID. Present on every valid response.
          type:
          - string
          - 'null'
        terms:
          description: Verbatim approved terms. Present on every valid response.
          type:
          - object
          - 'null'
        user_public_key:
          description: 0x-prefixed hex, 48-byte compressed G1 point.
          type:
          - string
          - 'null'
        user_sig_alg:
          description: 'BLS12-381, minimal pubkey size, IRTF basic scheme with DST
            BLS_SIG_BLS12381G2_XMD:SHA-256_SSWU_RO_NUL_. The _NUL_ suffix is the basic
            scheme; a library configured for proof-of-possession rejects every valid
            signature.

            '
          enum:
          - BLS12-381-G2-basic
          type:
          - string
          - 'null'
        user_signature:
          description: 0x-prefixed hex, 96-byte compressed G2 point.
          type:
          - string
          - 'null'
        valid:
          description: 'Whether the Yanez signature and receipt profile are genuine
            — and nothing else. A consumed or consent-expired receipt stays valid;
            consumed_now plus consent_not_after answer whether it may be ACTED on.

            '
          type: boolean
      required:
      - valid
      type: object
    PublicKeysOut:
      properties:
        keys:
          items:
            $ref: '#/components/schemas/AuthzJwk'
          type: array
      required:
      - keys
      type: object
    Terms:
      description: 'The approval display profile, version 1 (docs/agent-authorization-signed-approval-spec.md
        §3). Both apps render from exactly these fields, which is why the server enforces
        them rather than passing the object through.

        Unknown extension keys stay legal at every level and are stored untouched.
        An extension is data for the executor to match on; it never changes the authorized
        action, and the apps never render one.

        Every number anywhere in terms — including inside extensions — is an integer
        with abs(n) <= 2**53 - 1. That is where a double stops round-tripping integers
        exactly, so a JavaScript verifier reading the same terms cannot disagree with
        a Python one about the value. Quantities needing decimal precision travel
        as strings.

        '
      properties:
        action:
          description: Short, lowercase, stable across identical operations.
          example: payment.send
          minLength: 1
          type: string
        amount:
          description: 'Optional. Omit the entire field for non-financial actions;
            the apps then omit the Amount row. When supplied, currency is also required.
            No `display` field. A pre-formatted string can contradict the authoritative
            value and is the half a user reads, so terms carrying it are rejected.
            The apps format from minor_units and the currency''s own minor-unit exponent,
            and must not assume two decimal places.

            '
          properties:
            currency:
              description: Must equal the top-level currency exactly.
              type: string
            minor_units:
              description: 'The authoritative amount in the currency''s minor units,
                0 <= n <= 2**53 - 1.

                '
              minimum: 0
              type: integer
          required:
          - minor_units
          - currency
          type: object
        approval_title:
          description: The headline the app renders.
          minLength: 1
          type: string
        currency:
          description: 'Optional when the action has no monetary component. When supplied,
            it must be an ISO 4217 alpha-3 code from the configured allowlist. It
            is required whenever amount is present.

            '
          example: USD
          type: string
        details:
          description: Zero or more rows. Array order is reading order, and is significant.
          items:
            properties:
              emphasized:
                description: Optional. Omit for standard emphasis.
                type: boolean
              label:
                minLength: 1
                type: string
              value:
                minLength: 1
                type: string
            required:
            - label
            - value
            type: object
          type: array
        merchant:
          minLength: 1
          type: string
        schema_version:
          description: 'Required. The only supported value is 1. An absent, non-integer,
            or unsupported value is a 400, never a fallback to permissive validation.
            Distinct from the signed envelope''s own version.

            '
          enum:
          - 1
          type: integer
        summary:
          description: One sentence stating the whole action.
          minLength: 1
          type: string
      required:
      - schema_version
      - action
      - approval_title
      - summary
      - merchant
      - details
      type: object
    UserKeysOut:
      properties:
        keys:
          description: Every registered key for the yid, in registry order. Empty
            when none.
          items:
            properties:
              public_key:
                description: '0x-prefixed lowercase hex, the same spelling as the
                  yanez_user_public_key receipt claim.

                  '
                type: string
              tier:
                description: 'The key''s assurance tier, or null when the registry
                  holds no recognized tier. A null-tier key never verifies a decision.

                  '
                enum:
                - low
                - medium
                - high
                - null
                nullable: true
                type: string
            required:
            - tier
            - public_key
            type: object
          type: array
        yid:
          description: The yid the agent key belongs to.
          type: string
      required:
      - yid
      - keys
      type: object
  securitySchemes:
    AgentApiKey:
      bearerFormat: YanezAgentKey
      description: Show-once yak_ credential created in the YID app.
      scheme: bearer
      type: http
info:
  description: Agent and relying-party surface of the Yanez authorization service.
    Exported from the canonical server openapi.yaml; do not edit by hand — rerun openapi/export_subset.py.
  title: Yanez Agent Authorization
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/agent/authorizations:
    post:
      description: 'An agent asks its owner to approve the supplied terms. The yak_
        key identifies which YID to ask; it confers no authority of its own, and approval
        arrives asynchronously through the YID app.


        Sending an Idempotency-Key makes the create replay-safe: retrying an ambiguous
        failure with the same key and body returns the original request (201 plus
        Idempotency-Replayed: true) instead of prompting the user twice. The reservation
        is scoped to (agent key, Idempotency-Key) and is permanent for the life of
        the key.

        '
      operationId: agentCreateAuthorization
      parameters:
      - description: 'Opaque printable-ASCII retry token, chosen once per logical
          create and reused verbatim on every retry of it. Optional, but strongly
          recommended for any client that retries.


          Generate it from randomness, such as a UUID — never from the request content.
          The key identifies the operation, not the body: a key derived by hashing
          the terms makes two genuine identical purchases collapse into one, replaying
          the first request and returning its request_id without ever prompting the
          user. Reservations are permanent, so a content-derived key still replays
          months later.

          '
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 128
          minLength: 1
          pattern: ^[ -~]{1,128}$
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationCreateIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationCreateOut'
          description: 'The request, freshly created or replayed. A replay carries
            Idempotency-Replayed: true and reflects the request''s current status.

            '
          headers:
            Idempotency-Replayed:
              description: '"true" when this response replays an earlier create.'
              schema:
                type: string
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Terms that fail the version-1 profile (the error names the
            field — for example "terms.schema_version must be 1" or "terms.amount.display
            is no longer accepted"), intent_expires_at in the past, or a malformed
            Idempotency-Key.

            '
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing, malformed, or revoked agent key.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Idempotency key reused with a different request body.
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Terms exceed 4096 bytes of compact JSON.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Schema violation, such as decision_window_seconds out of 60-3600.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Hourly request limit or live-pending cap reached. Wait; do
            not create replacement requests in a loop. A same-body idempotent replay
            is answered before these limits and never 429s.

            '
      security:
      - AgentApiKey: []
      summary: Ask the key's owner to approve specific terms
  /api/agent/authorizations/{request_id}:
    get:
      description: 'Poll, or long-poll for up to wait seconds, for the decision. Readable
        only by the key that created the request. approved responses carry the signed
        artifact; pending, rejected, and expired responses never do.

        '
      operationId: agentGetAuthorization
      parameters:
      - in: path
        name: request_id
        required: true
        schema:
          type: string
      - description: Long-poll duration in seconds.
        in: query
        name: wait
        required: false
        schema:
          default: 0
          maximum: 25
          minimum: 0
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationOut'
          description: Current state of the request.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing, malformed, or revoked agent key.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'Unknown request id — including one created by a different
            agent key, deliberately indistinguishable.

            '
      security:
      - AgentApiKey: []
      summary: Poll for the user's decision
  /api/agent/user_keys:
    get:
      description: 'Returns the signing keys and assurance tiers registered for the
        user who issued this agent key. The yid comes from the agent key; the route
        takes no yid parameter. Use it to check that a receipt''s yanez_user_public_key
        is registered at the claimed yanez_assurance_tier, or to learn before asking
        that a required tier has no key. Read it at verification time: keys carry
        no revocation state, so a cached copy proves nothing.

        '
      operationId: agentUserKeys
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserKeysOut'
          description: The user's registered keys. An empty list is not an error.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Missing, malformed, or revoked agent key.
      security:
      - AgentApiKey: []
      summary: List the user's registered signing keys
  /api/authz/introspect:
    post:
      description: 'Unauthenticated: the receipt itself is the bearer proof. Signature
        and claims are checkable offline with the public keys; single-use enforcement
        is not, which is why this exists. valid answers only whether the receipt is
        genuine — consumed_now and consent_not_after answer whether it may be acted
        on, and every cryptographically valid response (including consent_expired
        and already_consumed) returns the decoded sub, jti, decided_at, consent_not_after,
        and terms.

        '
      operationId: authzIntrospect
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntrospectIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrospectOut'
          description: 'Verification result. Returned for invalid receipts too (valid=false,
            reason=bad_signature) — a bad receipt is an answer, not an error.

            '
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Malformed body, such as a missing artifact field.
      security: []
      summary: Verify a receipt online, and optionally consume it
  /api/authz/public-keys:
    get:
      description: 'Unauthenticated: a relying party must be able to verify an artifact
        without holding Yanez credentials, or the artifact is not portable proof.
        Keys are flat Ed25519 JWKs; select by kid from the receipt''s protected header,
        and refresh once on an unknown kid before rejecting.

        '
      operationId: authzPublicKeys
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicKeysOut'
          description: Currently accepted signing keys.
      security: []
      summary: Fetch the receipt-verification key set
