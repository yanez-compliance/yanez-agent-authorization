[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yanez-authz-mcp"
version = "0.1.0"
description = "Local stdio MCP server exposing Yanez agent authorization as two typed tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    # MCP server APIs evolve independently of the Yanez tool contract; pin the
    # major and isolate SDK-specific setup in server.py. 1.10 is the first release
    # with structured tool results.
    "mcp>=1.10,<2",
    "yanez-agent-authorization>=0.1.0,<0.2",
    "httpx>=0.27,<1",  # the --check diagnostic's single GET
]

[project.urls]
Homepage = "https://github.com/yanez-compliance/yanez-agent-authorization"
Repository = "https://github.com/yanez-compliance/yanez-agent-authorization"
Issues = "https://github.com/yanez-compliance/yanez-agent-authorization/issues"

[project.scripts]
yanez-authz-mcp = "yanez_authz_mcp.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/yanez_authz_mcp"]
