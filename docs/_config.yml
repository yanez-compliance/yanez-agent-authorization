title: Yanez Agent Authorization
description: Verifiable human approval for sensitive AI agent actions.
url: https://yanez-compliance.github.io
baseurl: /yanez-agent-authorization
github_repo: https://github.com/yanez-compliance/yanez-agent-authorization

permalink: pretty

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-relative-links
  - jekyll-redirect-from

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: default

nav:
  - section: Getting started
    items:
      - title: Overview
        url: /
      - title: Use with AI agents
        url: /ai-agents/
      - title: Choosing an integration path
        url: /integration-options/
      - title: HTTP quickstart
        url: /http-quickstart/
      - title: FAQ
        url: /faq/
      - title: Showcase
        url: /showcase/
  - section: Concepts
    items:
      - title: Terms
        url: /terms/
      - title: Receipts
        url: /receipts/
      - title: User-signed approvals
        url: /user-signed-approvals/
      - title: Action enforcement
        url: /action-enforcement/
