name: publish-python
# Releases packages/python to PyPI via trusted publishing (OIDC): no token anywhere.
# Trigger: push a tag python-v<version>, where <version> equals pyproject.toml's.
on:
  push:
    tags: ["python-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#python-v}"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [ "$tag" = "$version" ] || { echo "tag $tag != pyproject version $version"; exit 1; }
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist
